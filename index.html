const ok=l=>(!F.dept||l.dept===F.dept)&&(!F.q||(l.n+l.dept).toLowerCase().includes(F.q));
function build(){MAP={};VIS=LEAVES.filter(ok);
 for(const l of VIS)for(let d=l.s,i=0;d<=l.e&&i<400;d=addD(d,1),i++)(MAP[iso(d)]??=[]).push(l)}
function render(){
 build();const docs=DOCS.filter(ok),td=iso(TODAY),off=MAP[td]||[],n=names(off);
 $("#org").textContent=CFG.org;const nt=$("#notice");nt.hidden=!EMB.n.length;nt.innerHTML=EMB.n.map(x=>`📌 <b>${esc(x[0])}</b> · ${esc(x[1])}`).join("<br>");
 $("#k1").textContent=docs.length;$("#k2").textContent=n;$("#k3").textContent=Math.max(0,docs.length-n);
 $("#k4").textContent=names(VIS.filter(l=>l.s>TODAY&&l.s<=addD(TODAY,7)));
 $("#today").innerHTML=off.length?off.map(l=>`<button class="tp" data-d="${td}" style="--c:${l.t.c}">${av(l.n)} ${esc(first(l.n))} ${l.t.e}</button>`).join(""):`<span class="none">🎉 วันนี้แพทย์ครบทุกท่าน ปฏิบัติงานตามปกติ</span>`;
 const y=view.getFullYear(),m=view.getMonth(),f=new Date(y,m,1),l0=new Date(y,m+1,0),gs=addD(f,-f.getDay()),ge=addD(l0,6-l0.getDay()),inM=new Set();
 let h="";
 for(let d=gs;d<=ge;d=addD(d,1)){const ds=iso(d),a=MAP[ds]||[],c=names(a),w=c>=CFG.warnAt,mo=d.getMonth()===m;
  if(mo)a.forEach(l=>inM.add(l));
  h+=`<button class="mc ${c?(w?"h3":c>=3?"h2":"h1"):""} ${mo?"":"out"} ${ds===td?"today":""} ${ds<td?"past":""}" data-d="${ds}" aria-label="${fmt(d,{day:"numeric",month:"long"})} ลา ${c} ท่าน">
  <span class="top"><span class="mn">${d.getDate()}</span>${c?`<span class="bd ${w?"w":""}">${w?"⚠️":"🩺"} ${c}</span>`:""}</span>
  <span class="chs">${a.slice(0,3).map(l=>`<span class="ch ${l.pend?"pd":""}" style="background:${l.t.c}"><span>${l.t.e}${l.ab?"✈️":""} ${esc(first(l.n))}</span></span>`).join("")}${a.length>3?`<span class="more">+${a.length-3} ท่าน</span>`:""}</span></button>`}
 $("#cal").innerHTML=h;
 $("#mt").textContent="📅 "+fmt(view,{month:"long",year:"numeric"});
 $("#lead").textContent=`เดือนนี้มีการลา ${inM.size} รายการ จากแพทย์ ${docs.length} ท่าน`;
 $("#legend").innerHTML=TYPES.map(t=>`<span><i style="background:${t.c}"></i>${t.e} ${t.n}</span>`).join("")+`<span>✈️ = ต่างประเทศ</span><span>⏳ ขอบประ = รออนุมัติ</span>`;
 const s=$("#sync"),S=SYNC;s.className="sync"+(S.st==="err"?" warn":"");
 s.textContent=S.st==="live"?`🔄 ซิงค์จาก Google Sheet ${p2(S.at.getHours())}:${p2(S.at.getMinutes())} น.`:S.st==="err"?"⚠️ โหลด Google Sheet ไม่ได้ · กำลังแสดงข้อมูลจากไฟล์ Excel":"📋 ข้อมูลจากไฟล์ Excel (ส.ค. 69 – เม.ย. 70) · ใส่ลิงก์ Google Sheet ใน CFG เพื่อซิงค์อัตโนมัติ";
 const dp=$("#dp"),ds=[...new Set(DOCS.map(d=>d.dept).filter(Boolean))].sort();
 if(dp.options.length!==ds.length+1){dp.innerHTML=`<option value="">🏥 ทุกแผนก</option>`+ds.map(x=>`<option>${esc(x)}</option>`).join("");dp.value=F.dept}
 if($("#dlg").open)openDay(cur)}
function openDay(ds){cur=ds;const d=new Date(ds+"T00:00:00"),a=(MAP[ds]||[]).slice().sort((p,q)=>TYPES.indexOf(p.t)-TYPES.indexOf(q.t)||p.n.localeCompare(q.n,"th")),c=names(a),tot=DOCS.filter(ok).length;
 $("#sd").textContent=d.getDate();$("#sm").textContent=fmt(d,{month:"short"});
 $("#st").textContent=fmt(d,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 $("#ss").textContent=[ds===iso(TODAY)?"📍 วันนี้":"",`🏖️ ลา ${c} ท่าน`,`✅ ปฏิบัติงาน ${Math.max(0,tot-c)} ท่าน`].filter(Boolean).join(" · ");
 $("#sb").innerHTML=a.length?a.map(l=>{const len=Math.round((l.e-l.s)/864e5)+1,k=Math.round((d-l.s)/864e5)+1;
  return `<article class="lv" style="--c:${l.t.c}"><div class="av">${av(l.n)}</div><div><b>${esc(l.n)}</b><span class="dp">🏥 ${esc(l.dept||"ไม่ระบุแผนก")}</span></div>
  <div class="tg" style="grid-column:1/-1"><span class="ty">${l.t.e} ${esc(l.raw||l.t.n)}</span>${l.ab?"<span>✈️ ต่างประเทศ</span>":""}${l.pend?"<span>⏳ รออนุมัติ</span>":/อนุมัติ/.test(l.st)?"<span>✅ อนุมัติแล้ว</span>":""}${l.half?"<span>🌗 ครึ่งวัน</span>":""}</div>
  <p>📅 ${len===1?fmt(l.s):fmt(l.s)+" – "+fmt(l.e)} (${len} วัน${len>1?` · วันที่ ${k}/${len}`:""})</p>
  ${l.raw&&l.raw!==l.t.n?`<p>🏷️ หมวด: ${l.t.n}</p>`:""}${l.cover?`<p>🤝 ผู้ปฏิบัติงานแทน: ${esc(l.cover)}</p>`:""}${l.note?`<p>💬 ${esc(l.note)}</p>`:""}</article>`}).join(""):`<div class="empty"><b>☀️</b>ไม่มีแพทย์ลาในวันนี้</div>`;
 $("#sb").scrollTop=0;if(!$("#dlg").open)$("#dlg").showModal()}
function shift(n){const d=addD(new Date(cur+"T00:00:00"),n);if(d.getMonth()!==view.getMonth()){view=new Date(d.getFullYear(),d.getMonth(),1);render()}openDay(iso(d))}
function go(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(b)openDay(b.dataset.d);else if(e.target.id==="dlg")$("#dlg").close()});
$("#x").onclick=()=>$("#dlg").close();$("#pv").onclick=()=>shift(-1);$("#nx").onclick=()=>shift(1);
$("#mp").onclick=()=>go(-1);$("#mn").onclick=()=>go(1);$("#tdy").onclick=()=>{view=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);render()};
$("#dlg").addEventListener("keydown",e=>{if(e.key==="ArrowLeft")shift(-1);if(e.key==="ArrowRight")shift(1)});
let qt;$("#q").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{F.q=e.target.value.trim().toLowerCase();render()},150)};
$("#dp").onchange=e=>{F.dept=e.target.value;render()};
const th=$("#th");
function paint(){const d=document.documentElement.dataset.theme==="dark";th.textContent=d?"☀️":"🌙";th.title=d?"เปลี่ยนเป็นโหมดสว่าง":"เปลี่ยนเป็นโหมดมืด";$("#tc").content=d?"#231A1F":"#FFF1F6"}
th.onclick=()=>{const n=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("lv-theme",n)}catch(e){}paint()};
try{matchMedia("(prefers-color-scheme:dark)").addEventListener("change",e=>{if(!localStorage.getItem("lv-theme")){document.documentElement.dataset.theme=e.matches?"dark":"light";paint()}})}catch(e){}
paint();
(async()=>{await load();render();if(CFG.leavesCsv)setInterval(async()=>{await load();render()},CFG.refreshMin*6e4)})();
</script>
</body>
</html>
